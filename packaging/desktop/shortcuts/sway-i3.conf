# Optional example for Sway or i3 (the same syntax in both configs). xdg-terminal-exec (package xdg-terminal-exec)
# opens your preferred terminal; replace it with your terminal's own command if you like. Pick free shortcuts first.
bindsym $mod+Shift+a exec xdg-terminal-exec /usr/bin/ai-desktop ask
bindsym $mod+Shift+p exec xdg-terminal-exec /usr/bin/ai-desktop panel
