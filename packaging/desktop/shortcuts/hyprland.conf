# Optional example for Hyprland (hyprland.conf). xdg-terminal-exec (package xdg-terminal-exec) opens your preferred
# terminal; replace it with your terminal's own command if you like. Pick free shortcuts before adding these lines.
bind = SUPER SHIFT, A, exec, xdg-terminal-exec /usr/bin/ai-desktop ask
bind = SUPER SHIFT, P, exec, xdg-terminal-exec /usr/bin/ai-desktop panel
