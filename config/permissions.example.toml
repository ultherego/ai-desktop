version = 2

[network]
claude = true
codex = false
local = false
weather = true
web = false

[local]
port = 8080

[system]
systemd = ["system", "user"]

[files]
read = []
write = []
deny = []

[commands]
share_processes = false
host_sockets = []
deny = []

[commands.allow]
system = [
    "uname -a",
    "uname -r",
    "uptime",
    "hostnamectl",
    "timedatectl",
    "localectl",
    "nproc",
    "free -h",
    "vmstat 1 <int>",
]
systemd = [
    "systemd-analyze",
    "systemd-analyze blame",
    "systemd-analyze critical-chain",
    "systemd-analyze security --no-pager",
    "systemctl status <unit> --no-pager",
    "systemctl --failed --no-pager",
    "systemctl list-units --type=service --state=running --no-pager",
    "systemctl list-timers --no-pager",
    "systemctl is-active <unit>",
    "systemctl is-enabled <unit>",
    "journalctl --disk-usage",
]
hardware = [
    "lsblk",
    "lsblk -f",
    "lscpu",
    "lsmem",
    "lspci",
    "lspci -k",
    "lsusb",
    "sensors",
    "upower -d",
    "powerprofilesctl get",
]
packages = [
    "pacman -Qi <word>",
    "pacman -Qs <word>",
    "pacman -Qk <word>",
]
